# ==============================================================================
# AnyClass - Configurazione Bot Telegram & Modello Decisionale Multimodale
# ==============================================================================

telegram:
  # Inserisci il token ottenuto da @BotFather
  # Oppure esporta la variabile d'ambiente: export TELEGRAM_BOT_TOKEN="il_tuo_token"
  bot_token: "${TELEGRAM_BOT_TOKEN}"

  # Opzionale: ID numerico della tua chat Telegram per limitare l'accesso solo a te.
  # Se lasciato vuoto (null), il bot accetta messaggi da qualsiasi chat autorizzata.
  allowed_chat_id: null

# Modelli Decisionali Ollama (Zero token generati, inferenza diretta su logit/systemone)
model:
  # Modello decisionale multimodale per immagini e testo
  multimodal: "d1-omni:600m"

  # Modello decisionale per solo testo veloce (1.3 GB RAM, ~1s)
  text_only: "tev1:0.8b"

  # URL dell'API Ollama System One
  endpoint: "http://localhost:11434/v1/systemone"

# Pre-trattamento (Pre-processing dei contenuti)
preprocessing:
  # Se il messaggio contiene link a YouTube, Instagram, TikTok, usa yt-dlp per estrarre metadati e trascrizione
  extract_video_metadata: true

  # Percorso dell'eseguibile yt-dlp
  ytdlp_path: "yt-dlp"

  # Ridimensionamento immagini per inferenza rapida su CPU (512px ottimale)
  image_max_side_px: 512

  # Cartella dove archiviare gli allegati scaricati dal bot
  inbox_dir: "./inbox"

  # File JSONL dove salvare i record classificati
  results_file: "./results.jsonl"

  # Dashboard HTML locale da aggiornare automaticamente
  dashboard_file: "./dashboard_private.html"

# ==============================================================================
# CLASSI DI CLASSIFICAZIONE (Modificabili liberamente)
# Il modello sceglierà l'opzione migliore confrontando l'evidence con la description.
# ==============================================================================
classes:
  github_starred:
    name: "GitHub Repos"
    description: "Repository GitHub, codice open source o progetti software da esplorare o salvare tra i preferiti"
    destination: "GitHub Starred"
    action: "Aggiungi a Starred GitHub (`gh api -X PUT ...`)"

  cheatsheet_terminale:
    name: "Cheatsheet Terminale"
    description: "Comandi terminale, script bash/python, procedure di setup, configurazioni (.env, audio, tts) o cheatsheet pratici"
    destination: "Notion: Cheatsheet & Terminal Snippets"
    action: "Salva in Notion Cheatsheet"

  ai_tech_generico:
    name: "AI & Tech KB"
    description: "Articoli, video, paper, prompt engineering, spiegazioni o tool di Intelligenza Artificiale e software dev generico"
    destination: "Notion: Tech & AI Knowledge Base"
    action: "Salva in Notion Database 'Tech & AI Knowledge Base'"

  trading_wiki:
    name: "Trading Wiki"
    description: "Trading algoritmico, bot di trading, credenziali broker MT5, indicatori quantitativi, script Python di trading"
    destination: "GitHub Wiki: trading-agent-wiki"
    action: "Aggiungi a GitHub trading-agent-wiki"

  finanza_generale:
    name: "Finanza & Macro"
    description: "Macroeconomia, tassi di interesse, bond vigilantes, mercati finanziari, libri ed educazione finanziaria"
    destination: "Notion: Finanza & Investimenti"
    action: "Salva in Notion Database 'Finanza & Investimenti'"

  carriera_studio:
    name: "Carriera & Studio"
    description: "Curriculum vitae (CV), università (Bocconi, IULM, Cattolica), esami, orari lezioni, bandi e lavoro"
    destination: "Notion: Private Pages Carriera & Studio"
    action: "Salva in Notion Pagina Privata 'Carriera & Studio'"

  fitness_allenamento:
    name: "Fitness & Workout"
    description: "Palestra, allenamento con i pesi, dropset, myo reps, serie, carichi ed esecuzione esercizi"
    destination: "Notion: Fitness & Workout"
    action: "Salva in Notion Database 'Fitness & Workout'"

  ricette_meal_prep:
    name: "Ricette & Meal Prep"
    description: "Ricette, cibo, meal prep, cucina, idee di alimentazione o video culinari (Reel/TikTok/YouTube)"
    destination: "Notion: Meal Planner & Ricette"
    action: "Salva in Notion Database 'Meal Planner'"

  documenti_salute:
    name: "Salute & Documenti Personali"
    description: "Referti medici, allergie, visite sanitarie, libretto di circolazione auto o documenti personali sensibili"
    destination: "Notion: Salute & Archivio Locale Cifrato"
    action: "Archivia file protetto + log in Notion 'Salute & Documenti'"

  musica_thasup:
    name: "Musica Thasup"
    description: "Brani musicali, spoiler, audio o video di thasup (tha Supreme, yungest Moonstar), beat, SoundCloud o Spotify"
    destination: "Archivio Thasup & Playlist"
    action: "Download audio offline con `yt-dlp -x`"

  media_svago_generale:
    name: "Media & Svago"
    description: "Reel Instagram, TikTok, meme, video di intrattenimento, viaggi o contenuti social generici"
    destination: "Archivio Video (yt-dlp) & Notion Swipe File"
    action: "Download video locale con `yt-dlp`"
